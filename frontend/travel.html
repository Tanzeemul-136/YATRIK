<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel Logistics & Cultural Guide - Yatrik</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .travel-page-container {
      max-width: 1200px;
      margin: 1.5rem auto 100px auto;
      padding: 0 1.25rem;
    }

    /* Header Banner */
    .trip-header {
      position: relative;
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.94), rgba(30, 41, 59, 0.9)),
                  url('https://images.unsplash.com/photo-1436491865332-7a61a109cc05?auto=format&fit=crop&w=1200&q=80') center/cover no-repeat;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: var(--border-radius, 14px);
      padding: 2.25rem 2rem;
      margin-bottom: 2.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }

    @media (max-width: 768px) {
      .trip-header {
        flex-direction: column;
        text-align: center;
        gap: 1rem;
      }
    }

    .mode-pill {
      display: inline-block;
      font-size: 0.75rem;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      background: rgba(245, 158, 11, 0.15);
      color: var(--accent-gold, #f59e0b);
      border: 1px solid rgba(245, 158, 11, 0.35);
      padding: 0.25rem 0.75rem;
      border-radius: 20px;
      margin-bottom: 0.5rem;
      font-weight: 600;
    }

    .trip-header h2 {
      font-size: 2.1rem;
      color: #f8fafc;
      margin: 0 0 0.35rem 0;
      letter-spacing: 1px;
    }

    .trip-header p {
      color: #cbd5e1;
      font-size: 0.95rem;
      margin: 0;
    }

    /* Section Headings */
    .section-header-block {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin: 2.5rem 0 1.25rem 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 0.75rem;
    }

    .section-title {
      font-size: 1.35rem;
      color: var(--accent-gold, #f59e0b);
      margin: 0;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .demo-notice {
      font-size: 0.78rem;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    /* Instantaneous Tabs */
    .tabs-bar {
      display: flex;
      gap: 0.6rem;
      margin-bottom: 1.25rem;
      overflow-x: auto;
      padding-bottom: 0.35rem;
    }

    .tab-btn {
      background: var(--secondary-color, #1e293b);
      color: #94a3b8;
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 0.75rem 1.4rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      white-space: nowrap;
      transition: none; /* Explicit zero animation */
    }

    .tab-btn:hover {
      color: #f8fafc;
      background: var(--tertiary-color, #334155);
    }

    .tab-btn.active {
      background: var(--accent-gold, #f59e0b);
      color: #0f172a;
      border-color: var(--accent-gold, #f59e0b);
      font-weight: 700;
    }

    /* Filters Bar */
    .filter-bar {
      display: flex;
      justify-content: flex-end;
      gap: 1rem;
      margin-bottom: 1.25rem;
    }

    .filter-bar select {
      background: var(--secondary-color, #1e293b);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      padding: 0.65rem 1rem;
      color: #f8fafc;
      font-size: 0.88rem;
      outline: none;
    }

    /* Transport Card Layout */
    .transport-row {
      display: grid;
      grid-template-columns: 2fr 1.5fr 1.5fr 1.5fr auto;
      align-items: center;
      gap: 1.25rem;
      padding: 1.25rem 1.5rem;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      margin-bottom: 1rem;
      background: var(--secondary-color, #1e293b);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
      transition: none; /* No vehicle animations */
    }

    @media (max-width: 800px) {
      .transport-row {
        grid-template-columns: 1fr;
        gap: 0.75rem;
      }
    }

    .transport-row.selected {
      border-color: #22c55e;
      background: rgba(34, 197, 94, 0.08);
      box-shadow: 0 0 15px rgba(34, 197, 94, 0.2);
    }

    .transport-provider {
      font-size: 1.05rem;
      font-weight: 700;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    .transport-provider span.sub-text {
      font-size: 0.78rem;
      color: #94a3b8;
      font-weight: 400;
    }

    .transport-time {
      font-size: 0.95rem;
      color: #e2e8f0;
    }

    .transport-duration {
      font-size: 0.88rem;
      color: #94a3b8;
    }

    .transport-fare {
      font-size: 1.25rem;
      font-weight: 700;
      color: #38bdf8;
    }

    .select-transit-btn {
      background: rgba(255, 255, 255, 0.08);
      color: #f8fafc;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 0.65rem 1.5rem;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
    }

    .select-transit-btn:hover {
      background: var(--accent-gold, #f59e0b);
      color: #0f172a;
      border-color: var(--accent-gold, #f59e0b);
    }

    .transport-row.selected .select-transit-btn {
      background: #22c55e;
      color: #0f172a;
      border-color: #22c55e;
    }

    /* Discovery Cultural Grid */
    #discoveryArea.grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
      margin-top: 1rem;
    }

    .guide-card {
      background: var(--secondary-color, #1e293b);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
    }

    .guide-card img {
      width: 100%;
      height: 170px;
      object-fit: cover;
      background: #0f172a;
    }

    .guide-card-content {
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .guide-card h4 {
      margin: 0 0 0.35rem 0;
      color: #f8fafc;
      font-size: 1.15rem;
    }

    .guide-category-tag {
      font-size: 0.75rem;
      color: var(--accent-gold, #f59e0b);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 0.65rem;
    }

    .guide-card p {
      font-size: 0.88rem;
      color: #94a3b8;
      line-height: 1.5;
      margin: 0 0 1rem 0;
      flex-grow: 1;
    }

    .guide-card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 0.75rem;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 0.85rem;
      color: #cbd5e1;
    }

    /* Fixed Bottom Action Dock */
    .proceed-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-top: 1px solid rgba(245, 158, 11, 0.25);
      padding: 1rem 2.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 -4px 25px rgba(0, 0, 0, 0.5);
      z-index: 100;
    }

    .proceed-info {
      font-size: 0.92rem;
      color: #cbd5e1;
    }

    .proceed-info strong {
      color: var(--accent-gold, #f59e0b);
    }

    .proceed-cta-btn {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #0f172a;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 1.05rem;
      padding: 0.85rem 2.5rem;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(245, 158, 11, 0.25);
    }

    .proceed-cta-btn:hover {
      filter: brightness(1.1);
    }
  </style>
</head>
<body>
  <script src="js/common.js"></script>
  <script src="js/travel.js"></script>
  
  <main class="travel-page-container">
    <!-- Travel Page Header -->
    <header class="trip-header">
      <div>
        <span class="mode-pill">Manual Planning Mode</span>
        <h2>TRAVEL PAGE</h2>
        <p class="text-muted" id="tripDetails">Loading route parameters...</p>
      </div>
    </header>
    
    <!-- Section 1: Transportation Inventory -->
    <section>
      <div class="section-header-block">
        <h3 class="section-title"><span>🚆</span> SECTION 1: TRANSPORTATION</h3>
        <span class="demo-notice">Estimated Travel Inventory</span>
      </div>

      <!-- Instant Tabs: No vehicle animations -->
      <nav class="tabs-bar" aria-label="Transport Modes">
        <button class="tab-btn active" onclick="switchTransportTab('Flight')">✈️ Flights</button>
        <button class="tab-btn" onclick="switchTransportTab('Train')">🚂 Trains</button>
        <button class="tab-btn" onclick="switchTransportTab('Bus')">🚌 Buses</button>
        <button class="tab-btn" onclick="switchTransportTab('Cab')">🚕 Cabs</button>
      </nav>

      <!-- Sorting Bar -->
      <div class="filter-bar">
        <select id="transportSort" onchange="renderTransport()" aria-label="Sort Transportation">
          <option value="cheapest">Sort by: Lowest Estimated Fare</option>
          <option value="fastest">Sort by: Shortest Duration</option>
        </select>
      </div>

      <!-- Transport Inventory Container (Populated via travel.js) -->
      <div id="transportArea"></div>
    </section>
    
    <!-- Section 2: Local Discovery & Cultural Guide -->
    <section style="margin-top: 3.5rem;">
      <div class="section-header-block">
        <h3 class="section-title"><span>🏛️</span> SECTION 2: LOCAL DISCOVERY & CULTURAL GUIDE</h3>
        <span class="demo-notice">Database-Driven Regional Assets</span>
      </div>

      <!-- Discovery Category Tabs -->
      <nav class="tabs-bar" aria-label="Discovery Categories">
        <button class="tab-btn active" onclick="switchDiscoveryTab('places')">🏛️ Famous Places</button>
        <button class="tab-btn" onclick="switchDiscoveryTab('food')">🍽️ Famous Food</button>
        <button class="tab-btn" onclick="switchDiscoveryTab('restaurants')">🍴 Iconic Restaurants</button>
        <button class="tab-btn" onclick="switchDiscoveryTab('souvenirs')">🎁 Local Souvenirs</button>
      </nav>

      <!-- Discovery Catalog Grid (Populated via travel.js) -->
      <div id="discoveryArea" class="grid"></div>
    </section>
  </main>
  
  <!-- Docked Summary Bar -->
  <footer class="proceed-bar">
    <div class="proceed-info">
      <span>Ready to finalize your travel plan? Review budget and itinerary.</span>
    </div>
    <button class="proceed-cta-btn" onclick="window.location.href='summary.html'">PROCEED TO SUMMARY ➔</button>
  </footer>
</body>
</html>
