<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile - Yatrik</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .profile-header { display: flex; align-items: center; gap: 2rem; background: var(--secondary-color); padding: 2rem; border-radius: var(--border-radius); margin-bottom: 2rem; }
    .avatar { width: 80px; height: 80px; background: var(--accent-gold); color: var(--primary-color); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 2rem; font-weight: bold; }
    .profile-info h2 { margin: 0 0 0.5rem 0; color: var(--accent-gold); }
    .log-table { font-size: 0.9rem; }
  </style>
</head>
<body>
  <script src="js/common.js"></script>
  <script src="js/profile.js"></script>
  
  <main>
    <div class="profile-header">
      <div class="avatar" id="pAvatar">?</div>
      <div class="profile-info">
        <h2 id="pName">Loading...</h2>
        <p class="text-muted" id="pEmail"></p>
        <div style="margin-top:0.5rem; font-size:0.85rem;">
          User ID: <span id="pId" style="color:var(--text-main)"></span> | Member Since: <span id="pDate" style="color:var(--text-main)"></span>
        </div>
      </div>
    </div>
    
    <div class="tabs">
      <button class="tab-btn active" onclick="switchProfileTab('trips')">My Trips</button>
      <button class="tab-btn" onclick="switchProfileTab('favorites')">Favorites</button>
      <button class="tab-btn" onclick="switchProfileTab('logs')">System Logs</button>
    </div>
    
    <div id="tripsTab" class="tab-content active grid"></div>
    
    <div id="favoritesTab" class="tab-content">
      <p class="text-muted">Favorites feature coming soon...</p>
    </div>
    
    <div id="logsTab" class="tab-content">
      <table class="log-table">
        <thead>
          <tr><th>Timestamp</th><th>Action</th><th>Details</th></tr>
        </thead>
        <tbody id="logsTbody"></tbody>
      </table>
    </div>
  </main>
</body>
</html>
