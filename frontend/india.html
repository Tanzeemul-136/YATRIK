<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explore India - Yatrik</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .header-section { text-align: center; margin-bottom: 2rem; }
    .header-section h1 { color: var(--accent-gold); }
    .filters-section { background: var(--secondary-color); padding: 1rem; border-radius: var(--border-radius); margin-bottom: 2rem; display: flex; gap: 1rem; flex-wrap: wrap; }
    .filters-section input, .filters-section select { width: auto; flex: 1; min-width: 200px; }
    .dest-card { cursor: pointer; }
    .dest-card h3 { margin-bottom: 0.5rem; color: var(--accent-gold); }
    .dest-state { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1rem; }
    .dest-meta { font-size: 0.85rem; background: var(--bg-dark); padding: 0.5rem; border-radius: 4px; margin-top: 1rem; }
    .dest-meta span { display: block; margin-bottom: 0.25rem; }
  </style>
</head>
<body>
  <script src="js/common.js"></script>
  <script src="js/india.js"></script>
  
  <main>
    <div class="header-section">
      <h1>EXPLORE INDIA 🇮🇳</h1>
      <p>Discover the incredible destinations across India</p>
    </div>
    
    <div class="filters-section">
      <input type="text" id="searchInput" placeholder="Search by destination or state...">
      <select id="stateFilter">
        <option value="">All States</option>
      </select>
      <select id="sortSelect">
        <option value="alpha">Alphabetical (A-Z)</option>
        <option value="budget">Budget (Low-High)</option>
        <option value="days">Recommended Days</option>
      </select>
    </div>
    
    <div id="destinationsGrid" class="grid"></div>
  </main>
  
  <footer>
    <p>&copy; 2026 Yatrik Travel Platform</p>
  </footer>
</body>
</html>
